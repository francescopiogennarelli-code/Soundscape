<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9ecef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1114" media="(prefers-color-scheme: dark)">
<title>Soundscape – conductor</title>
<style>
:root{
  --bg:#e9ecef; --panel:#f6f7f8; --ink:#13171b; --mute:#566069; --line:#bcc4cb;
  --acc:#2c39d8; --acc-ink:#ffffff; --acc-soft:rgba(44,57,216,.14); --warn:#a4380f;
  --imgf:none;
  --font:Futura,"Avenir Next","Century Gothic","Trebuchet MS",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1114; --panel:#161a1e; --ink:#e7ebee; --mute:#97a2ab; --line:#2b333a;
    --acc:#8693ff; --acc-ink:#0e1114; --acc-soft:rgba(134,147,255,.18); --warn:#ff9a70; --imgf:invert(1);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1114; --panel:#161a1e; --ink:#e7ebee; --mute:#97a2ab; --line:#2b333a;
  --acc:#8693ff; --acc-ink:#0e1114; --acc-soft:rgba(134,147,255,.18); --warn:#ff9a70; --imgf:invert(1);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
.top,.pace{flex:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:18px 24px 10px}
.top h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.01em;line-height:1}
.top p{margin:4px 0 0;color:var(--mute);font-size:.85rem}
.status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--mute)}
.status .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:baseline}
.status .dot.on{background:var(--acc)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-height:36px}
.ghost:hover{border-color:var(--ink)}

/* pace bar: the whole piece, proportional to suggested time */
.pace{display:flex;gap:3px;padding:6px 24px 0}
.seg{position:relative;flex:1 1 0;min-width:0;height:34px;border:1px solid var(--line);border-radius:4px;background:var(--panel);overflow:hidden;padding:0;text-align:left}
.seg span{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:.72rem;color:var(--mute);white-space:nowrap;z-index:1}
.seg i{position:absolute;inset:0 auto 0 0;width:0;background:var(--acc-soft)}
.seg.done i{width:100%}
.seg.now{border-color:var(--acc)}
.seg.now span{color:var(--ink);font-weight:700}
.seg.now i{background:var(--acc-soft)}
.pace.ro .seg{cursor:default}

main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:40px;padding:16px 24px 14px;max-width:1440px;width:100%;flex:1;min-height:0;margin:0 auto}
main.nofield{grid-template-columns:minmax(0,1fr)}
.banner{min-height:1.4em;margin:0 0 6px;color:var(--warn);font-size:.9rem;font-weight:700}
.rng{margin:0;color:var(--mute);font-size:.95rem}
h2#ctitle{margin:0 0 10px;font-size:clamp(1.4rem,3vw,2.2rem);font-weight:800;letter-spacing:-.025em;line-height:1.02}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:6px 16px;font-weight:700;font-size:1.15rem;background:var(--panel)}
.chip small{font-weight:400;color:var(--mute);font-size:.78rem;margin-left:6px}
.rules{display:flex;flex-direction:column;gap:0;flex:1;min-height:0;overflow:hidden}
.rule{display:grid;grid-template-columns:calc(var(--rs,22px)*2) 1fr;gap:10px;padding:calc(var(--rs,22px)*.45) 0;border-top:1px solid var(--line)}
.rule .rn{font-weight:800;color:var(--acc);font-size:var(--rs,22px);line-height:1.3}
.rule p{margin:0;font-size:var(--rs,22px);line-height:1.3}
.rule.star p,.rule.note p{color:var(--mute);font-style:italic;font-size:calc(var(--rs,22px)*.8)}
.rule.note{border-top:2px solid var(--ink)}
.move{flex:none;margin:12px 0 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--panel);font-size:.95rem}
.move b{display:block;font-size:.8rem;color:var(--mute);margin-bottom:2px}
.cond-only{display:none}
#w20box[hidden]{display:none!important}
#w20btn{width:100%;margin-top:6px;white-space:normal;line-height:1.2;padding-top:8px;padding-bottom:8px}
#cue{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.chips,.rng,.banner,#ctitle{flex:none}
body.conducting .cond-only{display:block}

.timed{flex:none;margin:12px 0 0;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.timed .row{display:flex;gap:8px;margin-bottom:12px}
.tseg{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.85rem;color:var(--mute)}
.tseg b{display:block;color:var(--ink);font-size:1.05rem}
.tseg.now{border-color:var(--acc);background:var(--acc-soft)}
.tseg.now b{color:var(--ink)}
.tbig{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums;margin-right:14px}

.field{position:sticky;top:12px;align-self:start}
.field .wrap{position:relative}
canvas{display:block;width:100%;height:min(52vh,460px);background:var(--panel);border:1px solid var(--line);border-radius:12px}
.lr{position:absolute;left:12px;right:12px;bottom:8px;display:flex;justify-content:space-between;font-size:.72rem;color:var(--mute);pointer-events:none}
.cap{margin:10px 2px 0;color:var(--mute);font-size:.88rem;max-width:44ch}
#fig{display:flex;flex-direction:column;gap:12px}
#fig .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
#fig svg{display:block;width:100%;height:auto;max-height:17vh}
.stv [stroke="#000000"]{stroke:var(--ink)}
.stv [fill="#000000"],.stv path:not([fill]){fill:var(--ink)}
.stv [fill="#ffffff"]{fill:var(--panel)}
.stv [stroke="#ffffff"]{stroke:var(--panel)!important}
.stv path.Note{fill:var(--acc)!important}
.stv image{filter:var(--imgf,none)}
.stv .hl{fill:var(--acc);opacity:0;transition:opacity .2s}
.stv .hl.now{opacity:.2}
.chips{display:none!important}
#scoreView{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:16px 24px calc(24px + env(safe-area-inset-bottom,0px))}
#scoreView .bar{position:sticky;top:0;display:flex;justify-content:flex-end;padding-bottom:12px}
#scoreView img{display:block;width:min(100%,980px);height:auto;margin:0 auto 16px;background:#fff;border:1px solid var(--line)}
.plabel{align-self:center;font-weight:800;color:var(--acc);padding:0 2px}

.dock{flex:none;z-index:5;background:var(--panel);border-top:1px solid var(--line);padding:10px 24px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.clock{font-variant-numeric:tabular-nums}
.clock b{display:block;font-size:1.5rem;line-height:1.05;font-weight:800}
.clock small{color:var(--mute);font-size:.75rem}
.ctl{display:none;gap:8px;align-items:center}
body.conducting .ctl{display:flex}
.btn{min-height:46px;min-width:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.btn:hover{border-color:var(--ink)}
.btn.main{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);min-width:110px}
.grow{flex:1}
.size{display:none;align-items:center;gap:8px;font-size:.85rem;color:var(--mute)}
body.conducting .size{display:flex}
.size input{width:64px;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}

@media (max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:10px 16px 8px}
  main.nofield{grid-template-rows:minmax(0,1fr)}
  .field{position:static;order:-1}
  canvas{height:130px}
  #fig svg{max-height:10vh}
  .top,.pace{padding-left:16px;padding-right:16px}
  .dock{padding-left:16px;padding-right:16px;gap:14px}
  .seg span{display:none}
  .seg.now span{display:block}
}

/* arrow direction colours + the carried-over note */
:root{--up:#0b7a5a;--down:#c2410c;--lnk:#a21caf}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--up:#4ee0a8;--down:#ff9a70;--lnk:#f0a3ff}}
:root[data-theme="dark"]{--up:#4ee0a8;--down:#ff9a70;--lnk:#f0a3ff}
.stv path.arr-up{fill:var(--up)!important}
.stv path.arr-down{fill:var(--down)!important}
.stv polyline.arr-up{stroke:var(--up)!important}
.stv polyline.arr-down{stroke:var(--down)!important}
.stv path.lnk{fill:var(--lnk)!important}
.stv polyline.lnk{stroke:var(--lnk)!important}
.stv .lnk-ring{fill:none;stroke:var(--lnk);stroke-width:.9}
.stv .lnk-txt{fill:var(--lnk);font-family:var(--font);font-weight:700}
#fig .card.legend{display:flex;gap:28px;justify-content:center;align-items:center;flex-wrap:wrap;padding:8px 14px}
.legend .lg{display:flex;align-items:center;gap:10px;font-size:.95rem}
#fig .legend .lg svg{width:30px;height:46px;max-height:none;flex:none}
.legend .lg span{white-space:nowrap}
.legend .lg b{font-weight:800}
.legend .lg.up svg .shape{fill:var(--up)}   .legend .lg.up svg .ln{stroke:var(--up)}   .legend .lg.up em{color:var(--up)}
.legend .lg.down svg .shape{fill:var(--down)} .legend .lg.down svg .ln{stroke:var(--down)} .legend .lg.down em{color:var(--down)}
.legend .lg svg .ln{fill:none;stroke-width:2.4}
.legend .lg svg .ink{stroke:var(--ink);stroke-width:2.4}
.legend .lg svg text{fill:var(--ink);font-family:var(--font);font-size:15px;font-weight:700}
.legend .lg em{font-style:normal;font-weight:800}

/* hidden "I stopped" box */
.reveal{margin-top:14px}
.reveal-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;font:inherit;font-size:.95rem;color:var(--mute);background:transparent;border:1.5px dashed var(--line);border-radius:10px;padding:11px 14px;cursor:pointer}
.reveal-btn:hover,.reveal-btn:focus-visible,.reveal-btn[aria-expanded="true"]{border-color:var(--acc);color:var(--ink);outline:none}
.reveal-in{margin-top:8px;padding:6px 14px 10px;border-left:3px solid var(--acc);background:var(--acc-soft);border-radius:0 10px 10px 0}
.reveal-in[hidden]{display:none}
.reveal-t{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:6px 0 2px}

/* =====================================================================================================
   PHONE / TABLET / TOUCH LAYER
   Everything below only changes how the page behaves on touch devices and narrow screens.
   Wide desktop windows are not affected by any rule in this block.
   ===================================================================================================== */

/* ---- touch basics (harmless on desktop) ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overscroll-behavior-y:none}                       /* no accidental pull-to-refresh in the middle of the piece */
button,input,label,.seg{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn,.ghost,.seg{-webkit-user-select:none;user-select:none}
.btn:active{background:var(--acc-soft);border-color:var(--acc)}
.btn.main:active{background:var(--acc);border-color:var(--acc);filter:brightness(.86)}
.ghost:active{background:var(--acc-soft)}
@media (hover:none){
  .btn:hover,.ghost:hover{border-color:var(--line)}
  .btn.main:hover{border-color:var(--acc)}
}
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}   /* landscape notch */
#scoreView{padding:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) calc(24px + env(safe-area-inset-left,0px))}
.acts{display:contents}
#peers:empty{display:none}

/* ---- every compact situation: narrow windows, phones, landscape phones ----
   The page used to be locked to one screen and the text was shrunk to fit, which on a phone clipped rules
   away completely. Here the cue area scrolls instead and the text keeps a readable size (set in fit()). */
@media (max-width:860px), (max-height:560px) and (pointer:coarse){
  main{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
       grid-template-rows:none!important;grid-auto-rows:max-content;align-content:start;padding:12px 16px 28px}
  #cue{overflow:visible}
  .rules{flex:none;overflow:visible}
  .field{position:static}
  #fig svg{max-height:none}                                 /* the per-figure caps set in the script still apply */
  .ghost{min-height:40px}
  .btn{min-height:52px}
  #tbtn{flex:1;min-height:52px}
  .seg{height:36px}
  #scoreView .ghost{min-height:44px;padding:8px 18px}
  .reveal-btn{min-height:48px}
}

/* ---- stacked (portrait phones, tablets, narrow windows): title first, then notation/animation, then the rules ---- */
@media (max-width:860px){
  main{grid-template-columns:minmax(0,1fr)!important;gap:0}
  #cue{display:contents}
  #cue>*{grid-column:1}
  .banner{order:1;margin:0 0 4px;min-height:0}
  .banner:empty{display:none}
  .rng{order:2}
  h2#ctitle{order:3;font-size:clamp(1.55rem,7vw,2.1rem);margin:0 0 12px}
  .field{order:4;margin:0 0 14px}
  .rules{order:5}
  .timed{order:6}
  #move{order:7}
  #extra{order:8}
  .cap{max-width:none}
  .pace{padding:6px 14px 0}
}

/* ---- phones in portrait: slim header, big thumb-sized controls ---- */
@media (max-width:620px){
  .top{flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 14px 6px}
  .top h1{font-size:1.25rem}
  .top p{display:none}
  .status{display:contents}
  .status>span:first-child{order:1;flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:flex-end;font-size:.8rem}
  #sync{min-width:0;white-space:normal;line-height:1.15;text-align:right}
  .acts{order:2;display:flex;gap:6px;flex:1 1 100%}
  .acts .ghost{flex:1 1 0;min-width:0;padding:4px 6px;font-size:.8rem;line-height:1.15}
  .seg.now span{display:none}                                /* the label would be clipped in the narrow segments */
  .seg.now{border-width:2px}

  .dock{display:grid;grid-template-columns:1fr 1fr auto;gap:8px 12px;align-items:end;padding:8px 14px}   /* the page already pads for the home indicator */
  .dock .grow{display:none}
  .clock b{font-size:1.35rem}
  .clock small{display:block;font-size:.68rem;line-height:1.2;margin-top:1px}
  body.conducting .size{flex-direction:column;align-items:flex-start;gap:2px;font-size:.68rem}
  .size input{width:70px;min-height:40px;font-size:16px;text-align:center}       /* 16px stops iOS zooming in when the field is tapped */
  body.conducting .ctl{display:grid;grid-column:1/-1;grid-template-columns:56px 1fr 56px auto;gap:8px}
  .ctl .btn{min-width:0;padding:0 8px}
  .btn.main{font-size:1.1rem}
  #reset{padding:0 14px;font-size:.85rem;color:var(--mute)}
}

/* ---- phones in landscape: cue on the left, notation/animation on the right, whole thing scrolls ---- */
@media (min-width:620px) and (max-height:560px) and (pointer:coarse){
  .top{padding:6px 16px 2px}
  .top h1{font-size:1.15rem}
  .top p{display:none}
  .pace{padding:4px 16px 0}
  .seg{height:26px}
  main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:20px;padding:8px 16px 16px}
  main.nofield{grid-template-columns:minmax(0,1fr)!important}
  #cue{display:flex}
  #cue>*{grid-column:auto}
  .banner,.rng,h2#ctitle,.rules,.timed,#move,#extra,.field{order:0}
  h2#ctitle{font-size:clamp(1.3rem,3.2vw,1.8rem);margin:0 0 8px}
  .top{flex-wrap:nowrap;align-items:center;gap:10px}
  .top h1{white-space:nowrap}
  .status{flex:1;min-width:0;justify-content:flex-end;flex-wrap:nowrap;gap:10px;font-size:.78rem}
  .status>span:first-child{display:flex;align-items:center;min-width:0}
  #sync{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acts .ghost{min-height:34px;padding:4px 10px;font-size:.78rem;white-space:nowrap}
  .dock{flex-wrap:nowrap;padding:6px 16px;gap:12px}
  .clock b{font-size:1.25rem}
  .clock small{display:block;font-size:.65rem;line-height:1.15;max-width:150px}
  .size{font-size:.75rem}
  .size input{width:56px;font-size:16px}
  .btn{min-height:44px;min-width:44px;padding:0 12px}
  .btn.main{min-width:90px}
}
</style>
</head>
<body>

<header class="top">
  <div><h1>Soundscape</h1><p>Francesco Pio Gennarelli · for large ensemble</p></div>
  <div class="status">
    <span><span class="dot" id="dot"></span><span id="sync">Starting…</span></span>
    <span id="peers"></span>
    <div class="acts">
      <button class="ghost" id="scoreBtn">View score</button>
      <button class="ghost" id="modeBtn" hidden></button>
      <button class="ghost" id="loginBtn" hidden></button>
    </div>
  </div>
</header>

<nav class="pace" id="pace" aria-label="Sections of the piece"></nav>

<main>
  <section id="cue" aria-live="polite">
    <p class="banner" id="banner"></p>
    <p class="rng" id="rng"></p>
    <h2 id="ctitle"></h2>
    <div class="chips" id="chips"></div>
    <div class="rules" id="rules"></div>
    <div class="timed" id="timed" hidden></div>
    <div class="move cond-only" id="move"></div>
    <div class="move cond-only" id="extra" hidden></div>
    <div class="move cond-only" id="w20box" hidden><b>Rule 18</b><button class="btn main" id="w20btn" type="button">Everyone has stopped. Start 20 s</button></div>
  </section>

  <aside class="field" id="field" hidden>
    <div class="wrap" id="cvwrap">
      <canvas id="cv" role="img" aria-label="Illustration of sound moving through the ensemble"></canvas>
    </div>
    <div id="fig"></div>
    <div id="timedSlot"></div>
    <p class="cap" id="cap"></p>
  </aside>
</main>

<div id="scoreView" hidden><div class="bar"><button class="ghost" id="scoreClose">Close score</button></div><div id="scorePages"></div></div>

<footer class="dock">
  <div class="clock"><b id="clkTotal">0:00</b><small id="clkTotalT">piece</small></div>
  <div class="clock"><b id="clkCue">0:00</b><small id="clkCueT">this section</small></div>
  <div class="grow"></div>
  <label class="size">Players <input id="nIn" type="number" min="4" max="50" step="1" value="25" inputmode="numeric"></label>
  <div class="ctl">
    <button class="btn" id="prev" aria-label="Previous section">◀</button>
    <button class="btn main" id="play">Start</button>
    <button class="btn" id="next" aria-label="Next section">▶</button>
    <button class="btn" id="reset">Reset</button>
  </div>
</footer>

<script>
(function(){
"use strict";
var COMPACT=window.matchMedia("(max-width:860px), (max-height:560px) and (pointer:coarse)"),COARSE=window.matchMedia("(pointer:coarse)");

/* ------------------------------------------------------------------ score */
var R=function(n,t,k){return {n:n,t:t,k:k||""}};
var CUES=[
 {id:"1-5",rng:"Rules 1–5",title:"Hold the A",viz:"ripple",w:14,
  pitches:[["A"],["F"],["B"],["D"],["♯G"]],
  rules:[
   R("1","Play A or wait for someone else to play it, as soon as you hear it play A."),
   R("2","all the players must hold the note."),
   R("3","don’t stop, change note or change as soon as you hear someone changing note, do this untill all the notes are played"),
   R("*","if you are percussionist, make a sound as soon as you ear one, feel free to adapt the rules for your instruments. (keyboard instrument like piano can adapt the rule on the best they can)","star"),
   R("5","the musician that played first cannot anymore play first, it’s suggested that another type of instrument start playing as first.")],
  move:"Move on once all five notes have been played. Rule 5: ask a different kind of instrument to lead next time round."},
 {id:"6-9",rng:"Rules 6–9",title:"Notes change",viz:"ripple",w:12,
  pitches:[["♯G"],["♯C"],["♯C","highest ↑"],["♯C","lowest ↓"],["A","or E"]],
  rules:[
   R("6","when you are on the last note you can eather stop or keep playing ♯G."),
   R("*","Dynamics diminuendo with distance from the source","star"),
   R("7","change note or wait until someone else changes note."),
   R("*","play the highest ♯C available, Down = Lowest.","star"),
   R("8","keep repeating until all the notes indicated are played."),

function fit(){

  if(COMPACT.matches){                      /* phones / tablets: readable size, the cue area scrolls */
    var cw=r.clientWidth||320; r.style.setProperty("--rs",Math.max(17,Math.min(26,Math.round(cw/19)))+"px"); return;

document.addEventListener("keydown",function(e){
  if(!conducting()) return;
  var tag=(e.target&&e.target.tagName)||""; if(tag==="INPUT"||tag==="TEXTAREA") return;
  if(e.code==="Space"){e.preventDefault(); if(S.idx<CUES.length) S.running?pause():start()}
  else if(e.code==="ArrowRight"){e.preventDefault();nextStep()}
  else if(e.code==="ArrowLeft"){e.preventDefault();prevStep()}
});

/* ---------------------------------------------------------------- live sync (Firebase Realtime Database over plain HTTPS) */
var DBU=(SYNC.databaseURL||"").replace(/\/+$/,"");
function fbMergeAt(obj,path,val){
  var parts=path.split("/").filter(Boolean),o=obj;
  if(!parts.length) return val;
  for(var i=0;i<parts.length-1;i++){ if(typeof o[parts[i]]!=="object"||o[parts[i]]===null) o[parts[i]]={}; o=o[parts[i]] }
  if(val===null) delete o[parts[parts.length-1]]; else o[parts[parts.length-1]]=val;
  return obj;
}
function fbListen(){
  var remote=null;
  function got(){ if(remote&&typeof remote==="object"){ fb.live=true; applyRemote(remote); status() } }
  function poll(){
    fetch(DBU+"/piece/state.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){ if(d){remote=d;got()} }).catch(function(){});
  }
  try{
    var es=new EventSource(DBU+"/piece/state.json"); fb.sse=es;
    es.addEventListener("open",function(){fb.sseOpen=true});
    es.addEventListener("put",function(e){ try{var m=JSON.parse(e.data); remote=fbMergeAt(remote||{},m.path,m.data); if(m.path==="/"&&m.data===null) remote=null; got()}catch(x){} });
    es.addEventListener("patch",function(e){ try{var m=JSON.parse(e.data); Object.keys(m.data||{}).forEach(function(k){remote=fbMergeAt(remote||{},m.path+"/"+k,m.data[k])}); got()}catch(x){} });
    es.onerror=function(){ fb.sseOpen=false };
  }catch(x){}
  poll(); setInterval(function(){ if(!fb.sseOpen) poll() },3000);      /* fallback if streaming is blocked */
  /* before anyone has started anything, mark as connected once the database answers */
  fetch(DBU+"/.json?shallow=true",{cache:"no-store"}).then(function(r){ if(r.ok){fb.live=true;status()} }).catch(function(){});
}
function fbClock(){                                     /* learn how far this device's clock is from the server's */
  var best=null,n=0;
  function one(){
    var t0=Date.now();
    fetch(DBU+"/clock/ping.json",{method:"PUT",body:JSON.stringify({".sv":"timestamp"})}).then(function(r){return r.json()}).then(function(sv){
      var t1=Date.now(),rtt=t1-t0;
      if(typeof sv==="number"&&(best===null||rtt<best.rtt)){best={rtt:rtt,off:sv+rtt/2-t1}; fb.off=best.off}
      if(++n<4) setTimeout(one,300);
    }).catch(function(){});
  }
  one();
}
async function fbToken(){
  if(!fb.refTok) return null;
  if(fb.idTok&&Date.now()<fb.exp-60000) return fb.idTok;
  var r=await fetch("https://securetoken.googleapis.com/v1/token?key="+encodeURIComponent(SYNC.apiKey),{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(fb.refTok)});
  var j=await r.json(); if(!r.ok||!j.id_token) return null;
  fb.idTok=j.id_token; fb.refTok=j.refresh_token||fb.refTok; fb.exp=Date.now()+(+j.expires_in||3600)*1000; fbSave();
  return fb.idTok;
}
function fbSave(){ try{ localStorage.setItem("soundscape.conductor",JSON.stringify({r:fb.refTok,e:fb.email})) }catch(x){} }
function fbWrite(payload){
  fbToken().then(function(tok){
    if(!tok){ conductorOut("Your conductor sign-in expired. Sign in again."); return }
    payload.sv={".sv":"timestamp"};
    return fetch(DBU+"/piece/state.json?auth="+encodeURIComponent(tok),{method:"PUT",body:JSON.stringify(payload)}).then(function(r){
      if(r.status===401||r.status===403) conductorOut("Not allowed to conduct. Check the rules and the conductor email in SETUP.md.");
      else if(r.ok){fb.live=true;status()}
    });
  }).catch(function(){ fb.live=false; status() });
}
function conductorOut(msg){
  isOwner=false;playerView=false;fb.idTok=null;fb.refTok=null;
  try{localStorage.removeItem("soundscape.conductor")}catch(x){}
  shownIdx=-2;render(); if(msg) alert(msg);
}
async function conductorIn(){
  var email=prompt("Conductor email"); if(!email) return;
  var pw=prompt("Conductor password"); if(!pw) return;
  try{
    var r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(SYNC.apiKey),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.trim(),password:pw,returnSecureToken:true})});
    var j=await r.json();
    if(!r.ok){ alert("Sign-in failed. Check the email and password you created in Firebase."); return }
    fb.idTok=j.idToken;fb.refTok=j.refreshToken;fb.exp=Date.now()+(+j.expiresIn||3600)*1000;fb.email=email.trim();fbSave();
    isOwner=true;practice=false;shownIdx=-2;layout();render();
  }catch(e){ alert("Could not reach Firebase. Check your internet connection.") }
}
$("loginBtn").addEventListener("click",function(){
  if(isOwner){ if(confirm("Sign out of conducting on this device? Players keep following the last cue.")) conductorOut(""); }
  else conductorIn();
});

async function init(){
  if(!DBU||!SYNC.apiKey){status();return}
  try{ var saved=JSON.parse(localStorage.getItem("soundscape.conductor")||"null"); if(saved&&saved.r){fb.refTok=saved.r;fb.email=saved.e||""; if(await fbToken()) isOwner=true} }catch(e){}
  fbClock(); fbListen();
  shownIdx=-2; render();
}
/* keep the screen on while the page is open: phones otherwise dim and lock in the middle of the piece */
(function(){
  var lock=null,pending=false;
  function want(){
    if(!("wakeLock" in navigator)||document.hidden||lock||pending) return;
    pending=true;
    navigator.wakeLock.request("screen").then(function(l){pending=false;lock=l;l.addEventListener("release",function(){lock=null})}).catch(function(){pending=false});
  }
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) want() });
  document.addEventListener("pointerdown",want,{passive:true});
  want();
})();

init();
})();
